<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Thiện's Kitchen Notes{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block custom_css %}
    <!-- custom CSS from child templates goes here -->
    {% endblock %}
</head>
<body>
  <header class="page-header">
    <span class="logo">🌿 Thiện's Kitchen Notes</span>
    {% block breadcrumb %}
    <!-- breadcrumb from child templates goes here -->
    {% endblock %}
  </header>

  {% block content %}
  <!-- content from child templates goes here -->
  {% endblock %}

  <footer>Thiện's Kitchen Notes - My Kitchen &mdash; with love cooked &amp; shared</footer>
</body>
</html>
