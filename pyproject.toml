[project]
name = "kitchen-notes"
version = "0.1.0"
description = "A simple personal recipe web application built with Flask and Jinja2."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
    "gunicorn>=23.0.0"
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
